<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erasmus VET 2026 - Jurnale & Impresii</title>
    <base href="../../">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://www.gstatic.com/images/branding/productlogos/sites_2026/v3/ico/sites_2026_16dp.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Stiluri dedicate paginii de Experiență Culturală / Jurnale */
        .cultural-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            padding-top: 40px;
        }

        .cultural-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .cultural-header h1 {
            font-size: 2.3rem;
            color: #1a365d;
            margin-bottom: 10px;
        }

        .cultural-header p {
            color: #4a5568;
            font-size: 1.05rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.8rem;
            color: #1a365d;
            margin: 50px 0 25px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        /* Filtre Categorie */
        .cultural-filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 9px 20px;
            border: 1px solid #cbd5e0;
            background: #ffffff;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
            transition: all 0.25s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #2b6cb0;
            color: #ffffff;
            border-color: #2b6cb0;
            box-shadow: 0 4px 12px rgba(43, 108, 176, 0.25);
        }

        /* Grid Responsiv */
        .cultural-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            align-items: start;
        }

        /* Card-uri Jurnale */
        .cultural-card {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .cultural-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
        }

        /* Media Elements */
        .card-media {
            width: 100%;
            background-color: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card-media img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .video-wrapper {
            background: #000;
            padding: 10px 0;
        }

        .pdf-wrapper iframe {
            border: none;
            width: 100%;
            height: 280px;
        }

        /* Corp Card */
        .card-body {
            padding: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .badge-image   { background: #eef2ff; color: #4338ca; }
        .badge-video   { background: #fef3c7; color: #b45309; }
        .badge-journal { background: #ecfdf5; color: #047857; }

        .card-body h3 {
            font-size: 1.2rem;
            color: #1e293b;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .student-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #2b6cb0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-location {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 10px;
        }

        .card-body p {
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 12px;
            line-height: 1.45;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
        }

        .card-date {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #0d9488;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background: #0f766e;
        }

        /* STILURI CARDURI CITATE (QUOTES) */
        .quotes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .quote-card {
            background: #ffffff;
            border-left: 4px solid #2b6cb0;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .quote-icon {
            font-size: 1.8rem;
            color: #cbd5e0;
            margin-bottom: 10px;
        }

        .quote-text {
            font-style: italic;
            color: #2d3748;
            font-size: 0.98rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .quote-author {
            font-weight: 700;
            color: #1a365d;
            font-size: 0.95rem;
        }

        .quote-role {
            font-size: 0.8rem;
            color: #718096;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main class="cultural-container">
        <!-- Antet -->
        <header class="cultural-header">
            <h1>Jurnale de Bord & Impresii</h1>
            <p>Aici găsești jurnalele individuale realizate de elevi (PDF/Poze) și gândurile lor despre experiența Erasmus+ VET 2026.</p>
        </header>

        <!-- SECȚIUNEA 1: JURNALE ELEVI -->
        <h2 class="section-title"><i class="fa-solid fa-book-open"></i> Jurnalele Elevilor</h2>

        <!-- Filtre Dinamice -->
        <div class="cultural-filters">
            <button class="filter-btn active" onclick="filterContent('all', this)">Toate</button>
            <button class="filter-btn" onclick="filterContent('pdf', this)">Jurnale PDF</button>
            <button class="filter-btn" onclick="filterContent('image', this)">Galerii Poze</button>
            <button class="filter-btn" onclick="filterContent('video', this)">Video / Facebook</button>
        </div>

        <!-- Grid Dinamic de Jurnale -->
        <div class="cultural-grid" id="cultural-grid"></div>

        <!-- SECȚIUNEA 2: CITATE & IMPRESII -->
        <h2 class="section-title"><i class="fa-solid fa-quote-left"></i> Ce spun elevii</h2>
        <div class="quotes-grid" id="quotes-grid"></div>

    </main>

    <footer class="footer" id="footer-placeholder"></footer>

    <script src="components/load_coponent.js"></script>

    <script>
        // 1. LISTA DINAMICĂ CU JURNALELE ELEVILOR
        const materialeCulturale = [
            {
                type: 'pdf',
                title: 'Jurnal de Bord - Practică Web',
                studentName: 'Alexandru Popa',
                location: 'Montijo, Portugalia',
                date: '2026',
                pdfUrl: 'assets/docs/jurnal_alexandru.pdf', // Schimbă cu calea ta
                description: 'Documentarea completă a celor două săptămâni de stagiu și activități de învățare.'
            },
            {
                type: 'image',
                title: 'Jurnal Vizual & Galerie Foto',
                studentName: 'Maria Ionescu',
                location: 'Lisabona, Portugalia',
                date: '2026',
                src: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=800&q=80',
                caption: 'Imagini reprezentative din timpul orelor de practică și vizitelor culturale.'
            },
            {
                type: 'video',
                title: 'Reel - Impresii din Practică',
                studentName: 'Andrei Stancu',
                location: 'Montijo, Portugalia',
                date: '2026',
                iframeHtml: `<iframe src="https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2Freel%2F4594651954114670%2F&show_text=false&width=340&t=0" width="340" height="476" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`
            }
        ];

        // 2. LISTA DINAMICĂ CU CITATE / IMPRESII
        const citateElevi = [
            {
                quote: "Stagiul în Montijo mi-a dat încredere că pot construi proiecte web cap-coadă. A fost o experiență de neuitat!",
                author: "Alexandru Popa",
                role: "Elev Mate-Info"
            },
            {
                quote: "M-a impresionat mult cultura portugheză și modul în care am lucrat în echipa pe parcursul celor 14 zile.",
                author: "Elena Radu",
                role: "Elev Pedagogie"
            },
            {
                quote: "A fost combinația perfectă între învățarea de noi tehnologii și dezvoltarea personală.",
                author: "Matei Vasilescu",
                role: "Elev Mate-Info"
            }
        ];

        // Randare Jurnale
        function renderCultural(filtru = 'all') {
            const grid = document.getElementById('cultural-grid');
            grid.innerHTML = '';

            const items = filtru === 'all' 
                ? materialeCulturale 
                : materialeCulturale.filter(item => item.type === filtru);

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'cultural-card';

                let mediaContent = '';
                let badgeHTML = '';

                if (item.type === 'image') {
                    badgeHTML = `<span class="badge badge-image"><i class="fa-regular fa-image"></i> Galerie Poze</span>`;
                    mediaContent = `
                        <div class="card-media">
                            <img src="${item.src}" alt="${item.title}" loading="lazy">
                        </div>
                    `;
                } else if (item.type === 'video') {
                    badgeHTML = `<span class="badge badge-video"><i class="fa-solid fa-film"></i> Video / Reel</span>`;
                    mediaContent = `
                        <div class="card-media video-wrapper">
                            ${item.iframeHtml}
                        </div>
                    `;
                } else if (item.type === 'pdf') {
                    badgeHTML = `<span class="badge badge-journal"><i class="fa-regular fa-file-pdf"></i> Jurnal PDF</span>`;
                    mediaContent = `
                        <div class="card-media pdf-wrapper">
                            <iframe src="${item.pdfUrl}#toolbar=0"></iframe>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${mediaContent}
                    <div class="card-body">
                        ${badgeHTML}
                        <h3>${item.title}</h3>
                        ${item.studentName ? `<div class="student-name"><i class="fa-solid fa-user-graduate"></i> ${item.studentName}</div>` : ''}
                        <div class="card-footer">
                            <span class="card-date">2025</span>
                            ${item.type === 'pdf' ? `
                                <a href="${item.pdfUrl}" target="_blank" class="btn-download">
                                    <i class="fa-solid fa-download"></i> Deschide PDF
                                </a>
                            ` : ''}
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Randare Citate
        function renderQuotes() {
            const quotesContainer = document.getElementById('quotes-grid');
            quotesContainer.innerHTML = '';

            citateElevi.forEach(q => {
                const quoteCard = document.createElement('div');
                quoteCard.className = 'quote-card';
                quoteCard.innerHTML = `
                    <div>
                        <div class="quote-icon"><i class="fa-solid fa-quote-left"></i></div>
                        <div class="quote-text">"${q.quote}"</div>
                    </div>
                    <div>
                        <div class="quote-author">${q.author}</div>
                    </div>
                `;
                quotesContainer.appendChild(quoteCard);
            });
        }

        function filterContent(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCultural(type);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCultural();
            renderQuotes();
        });
    </script>
</body>
</html>
