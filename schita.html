<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erasmus VET 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://www.gstatic.com/images/branding/productlogos/sites_2026/v3/ico/sites_2026_16dp.ico">
</head>
<body>

    <!-- Meniul de navigare (Navbar) -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="https://lh3.googleusercontent.com/sitesv/AG8ngQVn3SIPGR2D60W38zygsxI_f9nUTkfCdwT8Wi7HswwXUmOV7SG5teZpbnIvziW1GhnwG86w4K745DTyDHIO2a5JN3DB_LHpACXPICx5dmP2sNb1nbSTLYGNrOclCowybq5U3C7lS2ePeBiRLuNgnMvGLa9m9TNVHXhRwk8vQ1LuS5x8jmuebAvUXcxohs0=w16383" alt="Logo">
                <span>Erasmus VET 2026</span>
            </a>

            <!-- Meniul Desktop -->
            <ul class="nav-menu">
                <li><a href="index.html" class="active">Acasa</a></li>
                <li><a href="portugalia.html">Portugalia</a></li>
                <li><a href="jurnale.html">Jurnale</a></li>
            </ul>

            <!-- Buton Hamburger (Vizibil pe Mobil) -->
            <button class="hamburger" id="hamburger-btn" aria-label="Meniu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Meniul Lateral Mobil (Sidebar Drawer) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="mobile-sidebar" id="mobile-sidebar">
        <button class="sidebar-close" id="sidebar-close" aria-label="Închide meniul">&times;</button>
        <ul class="mobile-menu">
            <li><a href="index.html">Acasa</a></li>
            <li><a href="portugalia.html">Portugalia</a></li>
            <li><a href="jurnale.html">Jurnale</a></li>
        </ul>
    </aside>




    




    <div style="height: 100vh;"></div>








    <footer class="footer">
        <div class="container footer-content">
            <small><strong>Contact:</strong></small>
            <small>Email: <a href="mailto:liceulmateibasarab@yahoo.com">liceulmateibasarab@yahoo.com</a></small>
            <small>Telefon/Fax: 0350 401 742, 0350 401 741</small>
            <small class="copyright">© 2026 Liceul Pedagogic – Toate drepturile rezervate</small>
        </div>
    </footer>

    <!-- Script JavaScript pentru controlul meniului mobil -->
    <script>
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileSidebar = document.getElementById('mobile-sidebar');
        const sidebarClose = document.getElementById('sidebar-close');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function toggleMenu() {
            mobileSidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        }

        hamburgerBtn.addEventListener('click', toggleMenu);
        sidebarClose.addEventListener('click', toggleMenu);
        sidebarOverlay.addEventListener('click', toggleMenu);

        // Închide meniul la click pe un link din sidebar
        document.querySelectorAll('.mobile-menu a').forEach(link => {
            link.addEventListener('click', () => {
                mobileSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });
        });
    </script>

</body>
</html>
